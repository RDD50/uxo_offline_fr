name: Build Android APK V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: |
          flutter create \
            --platforms=android \
            --project-name uxo_offline_fr \
            .

          rm -rf test
          rm -f analysis_options.yaml

      - name: Create native Android folder reader
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/uxo_offline_fr

          cat > android/app/src/main/kotlin/com/example/uxo_offline_fr/MainActivity.kt <<'KOTLIN'
          package com.example.uxo_offline_fr

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.provider.DocumentsContract
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodCall
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.security.MessageDigest

          class MainActivity : FlutterActivity() {
              private val channelName = "uxo_offline_fr/folder_reader"
              private val pickFolderRequest = 9001
              private var pendingPickResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "pickFolder" -> pickFolder(result)
                          "copyDatabaseToCache" -> copyDatabaseToCache(call, result)
                          "cacheImage" -> cacheImage(call, result)
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun pickFolder(result: MethodChannel.Result) {
                  if (pendingPickResult != null) {
                      result.error("PICKER_BUSY", "Sélection déjà en cours", null)
                      return
                  }

                  pendingPickResult = result

                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_PREFIX_URI_PERMISSION)
                  }

                  startActivityForResult(intent, pickFolderRequest)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != pickFolderRequest) {
                      return
                  }

                  val result = pendingPickResult
                  pendingPickResult = null

                  if (resultCode != Activity.RESULT_OK || data?.data == null) {
                      result?.success(null)
                      return
                  }

                  val uri = data.data!!

                  val flags = data.flags and (
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or
                      Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                  )

                  try {
                      contentResolver.takePersistableUriPermission(uri, flags)
                  } catch (_: Exception) {
                  }

                  result?.success(uri.toString())
              }

              private fun copyDatabaseToCache(call: MethodCall, result: MethodChannel.Result) {
                  try {
                      val treeUriText = call.argument<String>("treeUri")
                          ?: throw Exception("treeUri manquant")

                      val treeUri = Uri.parse(treeUriText)
                      val sourceUri = findDocumentUri(treeUri, "catuxo_database.json")
                          ?: throw Exception("catuxo_database.json introuvable")

                      val outFile = File(filesDir, "catuxo_database.json")

                      contentResolver.openInputStream(sourceUri).use { input ->
                          if (input == null) {
                              throw Exception("Impossible d’ouvrir catuxo_database.json")
                          }

                          outFile.outputStream().use { output ->
                              input.copyTo(output)
                          }
                      }

                      result.success(outFile.absolutePath)
                  } catch (e: Exception) {
                      result.error("COPY_DATABASE_ERROR", e.message, null)
                  }
              }

              private fun cacheImage(call: MethodCall, result: MethodChannel.Result) {
                  try {
                      val treeUriText = call.argument<String>("treeUri")
                          ?: throw Exception("treeUri manquant")

                      val path = call.argument<String>("path")
                          ?: throw Exception("path manquant")

                      val cacheDirImages = File(cacheDir, "image_cache")
                      if (!cacheDirImages.exists()) {
                          cacheDirImages.mkdirs()
                      }

                      val ext = path.substringAfterLast('.', "jpg")
                      val fileName = sha1(path) + "." + ext
                      val outFile = File(cacheDirImages, fileName)

                      if (outFile.exists() && outFile.length() > 0) {
                          result.success(outFile.absolutePath)
                          return
                      }

                      val treeUri = Uri.parse(treeUriText)
                      val fileUri = findDocumentUri(treeUri, path)
                          ?: throw Exception("Image introuvable : $path")

                      contentResolver.openInputStream(fileUri).use { input ->
                          if (input == null) {
                              throw Exception("Impossible d’ouvrir : $path")
                          }

                          outFile.outputStream().use { output ->
                              input.copyTo(output)
                          }
                      }

                      result.success(outFile.absolutePath)
                  } catch (e: Exception) {
                      result.error("CACHE_IMAGE_ERROR", e.message, null)
                  }
              }

              private fun findDocumentUri(treeUri: Uri, relativePath: String): Uri? {
                  val cleanParts = relativePath
                      .split("/")
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }

                  if (cleanParts.isEmpty()) {
                      return null
                  }

                  var currentDocumentId = DocumentsContract.getTreeDocumentId(treeUri)

                  for (part in cleanParts) {
                      val childId = findChildDocumentId(treeUri, currentDocumentId, part)
                          ?: return null

                      currentDocumentId = childId
                  }

                  return DocumentsContract.buildDocumentUriUsingTree(
                      treeUri,
                      currentDocumentId
                  )
              }

              private fun findChildDocumentId(
                  treeUri: Uri,
                  parentDocumentId: String,
                  wantedName: String
              ): String? {
                  val childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(
                      treeUri,
                      parentDocumentId
                  )

                  val projection = arrayOf(
                      DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                      DocumentsContract.Document.COLUMN_DISPLAY_NAME
                  )

                  contentResolver.query(
                      childrenUri,
                      projection,
                      null,
                      null,
                      null
                  ).use { cursor ->
                      if (cursor == null) {
                          return null
                      }

                      val idIndex = cursor.getColumnIndexOrThrow(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID
                      )

                      val nameIndex = cursor.getColumnIndexOrThrow(
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME
                      )

                      while (cursor.moveToNext()) {
                          val documentId = cursor.getString(idIndex)
                          val displayName = cursor.getString(nameIndex)

                          if (displayName == wantedName) {
                              return documentId
                          }
                      }
                  }

                  return null
              }

              private fun sha1(text: String): String {
                  val bytes = MessageDigest.getInstance("SHA-1")
                      .digest(text.toByteArray())

                  return bytes.joinToString("") {
                      "%02x".format(it)
                  }
              }
          }
          KOTLIN

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Get dependencies
        run: flutter pub get

      - name: Force app compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          patched = False

          for path in candidates:
              if not path.exists():
                  continue

              text = path.read_text()
              original = text

              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )
              text = text.replace(
                  "targetSdk = flutter.targetSdkVersion",
                  "targetSdk = 36"
              )
              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36"
              )
              text = text.replace(
                  "targetSdkVersion flutter.targetSdkVersion",
                  "targetSdkVersion 36"
              )

              text = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", text)
              text = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 36", text)
              text = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", text)
              text = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 36", text)

              if text != original:
                  path.write_text(text)
                  patched = True
                  print(f"Patched {path}")

          if not patched:
              raise SystemExit("Aucun fichier Gradle Android app patché")
          PY

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxo-offline-fr-apk
          path: build/app/outputs/flutter-apk/app-release.apk
