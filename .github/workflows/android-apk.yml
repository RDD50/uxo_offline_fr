name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name uxo_offline_fr .
          rm -rf test
          rm -f analysis_options.yaml

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Force compileSdk 36 everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("android"),
              Path.home() / ".pub-cache",
          ]

          patched = []

          def patch_file(path: Path):
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  return

              original = text

              # Kotlin DSL / Flutter récent
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")

              # Groovy / ancien format
              text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              text = text.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")

              # Valeurs numériques existantes
              text = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", text)
              text = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 36", text)
              text = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", text)
              text = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 36", text)

              if text != original:
                  path.write_text(text)
                  patched.append(str(path))

          for root in roots:
              if not root.exists():
                  continue

              for name in ["build.gradle", "build.gradle.kts"]:
                  for path in root.rglob(name):
                      patch_file(path)

          print("Fichiers Gradle patchés :")
          for path in patched:
              print(path)

          if not patched:
              raise SystemExit("Aucun fichier Gradle patché.")
          PY

      - name: Inspect compileSdk values
        run: |
          echo "=== compileSdk dans le projet ==="
          grep -R "compileSdk" android ~/.pub-cache/hosted -n | head -n 80 || true

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxo-offline-fr-apk
          path: build/app/outputs/flutter-apk/app-release.apk
