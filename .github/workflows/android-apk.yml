name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name uxo_offline_fr .
          rm -rf test
          rm -f analysis_options.yaml

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Force compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )

          text = text.replace(
              "targetSdk = flutter.targetSdkVersion",
              "targetSdk = 36"
          )

          gradle.write_text(text)
          print("compileSdk et targetSdk forcés à 36")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxo-offline-fr-apk
          path: build/app/outputs/flutter-apk/app-release.apk

