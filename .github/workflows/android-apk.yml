name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name uxo_offline_fr .
          rm -rf test
          rm -f analysis_options.yaml

      - name: Create native Android ZIP picker
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/uxo_offline_fr

          cat > android/app/src/main/kotlin/com/example/uxo_offline_fr/MainActivity.kt <<'KOTLIN'
          package com.example.uxo_offline_fr

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "uxo_offline_fr/file_picker"
              private val requestCodePickZip = 7010
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      if (call.method == "pickZip") {
                          if (pendingResult != null) {
                              result.error("BUSY", "Une sélection de fichier est déjà en cours.", null)
                              return@setMethodCallHandler
                          }

                          pendingResult = result

                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                              putExtra(
                                  Intent.EXTRA_MIME_TYPES,
                                  arrayOf(
                                      "application/zip",
                                      "application/octet-stream",
                                      "application/x-zip-compressed",
                                      "multipart/x-zip"
                                  )
                              )
                          }

                          startActivityForResult(intent, requestCodePickZip)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != requestCodePickZip) {
                      return
                  }

                  val result = pendingResult
                  pendingResult = null

                  if (result == null) {
                      return
                  }

                  if (resultCode != Activity.RESULT_OK || data?.data == null) {
                      result.error("CANCELLED", "Sélection annulée.", null)
                      return
                  }

                  val uri: Uri = data.data!!

                  try {
                      contentResolver.openInputStream(uri).use { input ->
                          if (input == null) {
                              result.error("READ_ERROR", "Impossible d’ouvrir le fichier sélectionné.", null)
                              return
                          }

                          val bytes = input.readBytes()
                          result.success(bytes)
                      }
                  } catch (e: Exception) {
                      result.error("READ_ERROR", e.message, null)
                  }
              }
          }
          KOTLIN

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Force app compileSdk 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
            grep -n "compileSdk\|targetSdk\|minSdk" android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/g' android/app/build.gradle
            grep -n "compileSdk\|targetSdk\|minSdk" android/app/build.gradle
          else
            find android/app -maxdepth 2 -type f | sort
            exit 1
          fi

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxo-offline-fr-apk
          path: build/app/outputs/flutter-apk/app-release.apk
