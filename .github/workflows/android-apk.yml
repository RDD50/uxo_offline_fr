name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name uxo_offline_fr .
          rm -rf test
          rm -f analysis_options.yaml

      - name: Create native Android folder reader
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/uxo_offline_fr

          cat > android/app/src/main/kotlin/com/example/uxo_offline_fr/MainActivity.kt <<'KOTLIN'
          package com.example.uxo_offline_fr

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.provider.DocumentsContract
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "uxo_offline_fr/folder_reader"
              private val requestCodePickFolder = 8010
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "pickFolder" -> pickFolder(result)

                          "readText" -> {
                              val args = call.arguments as? Map<*, *>
                              val treeUri = args?.get("treeUri") as? String
                              val path = args?.get("path") as? String

                              if (treeUri == null || path == null) {
                                  result.error("BAD_ARGS", "Arguments invalides.", null)
                                  return@setMethodCallHandler
                              }

                              readText(treeUri, path, result)
                          }

                          "readBytes" -> {
                              val args = call.arguments as? Map<*, *>
                              val treeUri = args?.get("treeUri") as? String
                              val path = args?.get("path") as? String

                              if (treeUri == null || path == null) {
                                  result.error("BAD_ARGS", "Arguments invalides.", null)
                                  return@setMethodCallHandler
                              }

                              readBytes(treeUri, path, result)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun pickFolder(result: MethodChannel.Result) {
                  if (pendingResult != null) {
                      result.error("BUSY", "Une sélection de dossier est déjà en cours.", null)
                      return
                  }

                  pendingResult = result

                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_PREFIX_URI_PERMISSION)
                  }

                  startActivityForResult(intent, requestCodePickFolder)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != requestCodePickFolder) {
                      return
                  }

                  val result = pendingResult
                  pendingResult = null

                  if (result == null) {
                      return
                  }

                  if (resultCode != Activity.RESULT_OK || data?.data == null) {
                      result.error("CANCELLED", "Sélection annulée.", null)
                      return
                  }

                  val uri = data.data!!
                  val flags = data.flags and
                      (Intent.FLAG_GRANT_READ_URI_PERMISSION or
                       Intent.FLAG_GRANT_WRITE_URI_PERMISSION)

                  try {
                      contentResolver.takePersistableUriPermission(uri, flags)
                  } catch (_: Exception) {
                  }

                  result.success(uri.toString())
              }

              private fun readText(treeUriString: String, relativePath: String, result: MethodChannel.Result) {
                  try {
                      val uri = findDocumentUri(Uri.parse(treeUriString), relativePath)

                      if (uri == null) {
                          result.error("NOT_FOUND", "Fichier introuvable : $relativePath", null)
                          return
                      }

                      val input = contentResolver.openInputStream(uri)

                      if (input == null) {
                          result.error("READ_ERROR", "Impossible d’ouvrir : $relativePath", null)
                          return
                      }

                      val text = input.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      result.success(text)
                  } catch (e: Exception) {
                      result.error("READ_ERROR", e.message, null)
                  }
              }

              private fun readBytes(treeUriString: String, relativePath: String, result: MethodChannel.Result) {
                  try {
                      val uri = findDocumentUri(Uri.parse(treeUriString), relativePath)

                      if (uri == null) {
                          result.error("NOT_FOUND", "Fichier introuvable : $relativePath", null)
                          return
                      }

                      val input = contentResolver.openInputStream(uri)

                      if (input == null) {
                          result.error("READ_ERROR", "Impossible d’ouvrir : $relativePath", null)
                          return
                      }

                      val bytes = input.use { it.readBytes() }
                      result.success(bytes)
                  } catch (e: Exception) {
                      result.error("READ_ERROR", e.message, null)
                  }
              }

              private fun findDocumentUri(treeUri: Uri, relativePath: String): Uri? {
                  var currentDocumentId = DocumentsContract.getTreeDocumentId(treeUri)

                  val cleanParts = relativePath
                      .split("/")
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }

                  if (cleanParts.isEmpty()) {
                      return DocumentsContract.buildDocumentUriUsingTree(treeUri, currentDocumentId)
                  }

                  for (part in cleanParts) {
                      val childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(
                          treeUri,
                          currentDocumentId
                      )

                      val cursor = contentResolver.query(
                          childrenUri,
                          arrayOf(
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                              DocumentsContract.Document.COLUMN_DOCUMENT_ID
                          ),
                          null,
                          null,
                          null
                      )

                      var foundDocumentId: String? = null

                      cursor?.use {
                          val nameIndex = it.getColumnIndex(DocumentsContract.Document.COLUMN_DISPLAY_NAME)
                          val idIndex = it.getColumnIndex(DocumentsContract.Document.COLUMN_DOCUMENT_ID)

                          while (it.moveToNext()) {
                              val name = it.getString(nameIndex)
                              val id = it.getString(idIndex)

                              if (name == part) {
                                  foundDocumentId = id
                                  break
                              }
                          }
                      }

                      if (foundDocumentId == null) {
                          return null
                      }

                      currentDocumentId = foundDocumentId!!
                  }

                  return DocumentsContract.buildDocumentUriUsingTree(treeUri, currentDocumentId)
              }
          }
          KOTLIN

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Force app compileSdk 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
            grep -n "compileSdk\|targetSdk\|minSdk" android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/g' android/app/build.gradle
            grep -n "compileSdk\|targetSdk\|minSdk" android/app/build.gradle
          else
            find android/app -maxdepth 2 -type f | sort
            exit 1
          fi

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxo-offline-fr-apk
          path: build/app/outputs/flutter-apk/app-release.apk
